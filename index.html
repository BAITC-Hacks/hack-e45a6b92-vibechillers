<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple personal expense tracker for students." />
    <title>Spendwise - Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Student budget</p>
        <h1>Spendwise</h1>
          <p class="intro">A clear view of your spending, one month at a time.</p>
      </header>

      <section class="panel add-expense" aria-labelledby="add-expense-title">
        <div class="section-heading">
          <h2 id="add-expense-title">Add an expense</h2>
          <span class="currency-tag">KZT</span>
        </div>
        <form id="expense-form" novalidate>
          <div id="form-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          <div class="form-grid">
            <label>
              Amount (KZT)
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 1500" required />
            </label>
            <label>
              Category
              <input id="category" name="category" type="text" maxlength="50" placeholder="e.g. Food" required />
            </label>
            <label>
              Date
              <input id="date" name="date" type="date" required />
            </label>
            <label class="description-field">
              Description <span>(optional)</span>
              <input id="description" name="description" type="text" maxlength="120" placeholder="What was it for?" />
            </label>
          </div>
          <button type="submit" class="primary-button">Add expense</button>
        </form>
      </section>

      <section class="dashboard" aria-label="Expense summary">
        <div class="month-control">
          <label for="month">Viewing month</label>
          <input id="month" type="month" />
        </div>
        <article class="total-card">
          <p>This month's total</p>
          <strong id="monthly-total" aria-live="polite">KZT 0</strong>
        </article>
      </section>

      <section class="content-grid">
        <section class="panel expenses-panel" aria-labelledby="expenses-title">
          <div class="section-heading">
            <h2 id="expenses-title">Expenses</h2>
            <span id="expense-count" class="item-count">0 items</span>
          </div>
          <div id="expense-list" class="expense-list" aria-live="polite"></div>
        </section>

        <aside class="panel categories-panel" aria-labelledby="categories-title">
          <div class="section-heading">
            <h2 id="categories-title">By category</h2>
          </div>
          <div id="category-totals" class="category-totals" aria-live="polite"></div>
        </aside>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
